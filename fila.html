<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Aguarde um instante</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#1e40af 0%,#1e3a8a 50%,#132a63 100%);display:flex;align-items:center;justify-content:center;padding:22px}
.card{background:#fff;border-radius:14px;max-width:320px;width:100%;padding:26px 24px 22px;text-align:center;box-shadow:0 20px 46px rgba(4,15,45,.4)}
h1{color:#2563eb;font-size:17px;font-weight:800;margin-bottom:7px;letter-spacing:-.2px}
.txt{color:#5b5b5b;font-size:12.5px;line-height:1.5;margin-bottom:18px}
.anel{position:relative;width:64px;height:64px;margin:0 auto 16px}
.anel svg{transform:rotate(-90deg);display:block}
.trilha{fill:none;stroke:#e8efff;stroke-width:3}
.prog{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:0;animation:girar 5s linear forwards}
@keyframes girar{to{stroke-dashoffset:163.4}}
.num{position:absolute;inset:0;display:grid;place-items:center;color:#2563eb;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.rodape{font-size:11px;color:#9a9a9a;letter-spacing:.3px}
.noscript{margin-top:12px;font-size:11.5px;color:#777}
.noscript a{color:#2563eb;font-weight:700}
</style>
<noscript><meta http-equiv="refresh" content="5;url=/pt2"></noscript>
</head>
<body>

<div class="card">
  <h1>Aguarde um instante</h1>
  <p class="txt">Sala de espera virtual. Seu acesso será liberado em poucos segundos.</p>

  <div class="anel">
    <svg viewBox="0 0 64 64" width="64" height="64">
      <circle class="trilha" cx="32" cy="32" r="26"></circle>
      <circle class="prog" cx="32" cy="32" r="26"></circle>
    </svg>
    <div class="num" id="num">5</div>
  </div>

  <p class="rodape">Liberando acesso</p>
  <noscript><p class="noscript">Se não redirecionar, <a href="/pt2">clique aqui</a>.</p></noscript>
</div>

<script>
(function(){
  var n = 5, el = document.getElementById('num');
  var t = setInterval(function(){
    n--;
    el.textContent = n > 0 ? n : 0;
    if(n <= 0){ clearInterval(t); window.location.href = '/pt2'; }
  }, 1000);
})();
</script>

</body>
</html>
